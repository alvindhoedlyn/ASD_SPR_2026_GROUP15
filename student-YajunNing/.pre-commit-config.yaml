repos:
  - repo: local
    hooks:
      - id: ruff-scan
        name: Student 5 Ruff security scan
        entry: python student-YajunNing/tests/pre_commit_pytest.py tests/pre_commit/test_ruff_scan.py -v
        language: python
        additional_dependencies: ["pytest==9.1.1", "ruff==0.16.8"]
        pass_filenames: false
        stages: [pre-commit]

      - id: detect-secrets-scan
        name: Student 5 detect-secrets scan
        entry: python student-YajunNing/tests/pre_commit_pytest.py tests/pre_commit/test_secrets_scan.py -v
        language: python
        additional_dependencies: ["pytest==9.1.1", "detect-secrets==1.5.0"]
        pass_filenames: false
        stages: [pre-commit]

      - id: pip-audit-scan
        name: Student 5 pip-audit dependency scan
        entry: python student-YajunNing/tests/pre_commit_pytest.py tests/pre_commit/test_dependency_audit.py -v
        language: python
        additional_dependencies: ["pytest==9.1.1", "pip-audit==2.10.1"]
        pass_filenames: false
        stages: [pre-commit]
