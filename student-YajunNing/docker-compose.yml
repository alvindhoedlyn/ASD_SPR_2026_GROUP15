services:
  yajunning-frontend-service:
    build: ./frontend
    container_name: yajunning-flight-frontend
    ports:
      - "5505:80"
    depends_on:
      - yajunning-backend-service
    networks:
      - flight-network

  yajunning-backend-service:
    build: ./backend
    container_name: yajunning-flight-backend
    ports:
      - "5605:5005"
    environment:
      PORT: "5005"
      DATABASE_SERVICE_URL: http://yajunning-database-service:6005
      AUTH_SERVICE_URL: http://host.docker.internal:5000
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: qwen2.5:0.5b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - yajunning-database-service
    networks:
      - flight-network

  yajunning-database-service:
    build: ./database
    container_name: yajunning-flight-database
    ports:
      - "5705:6005"
    environment:
      PORT: "6005"
      DATABASE_PATH: /app/data/flights.db
    volumes:
      - flight-data:/app/data
    networks:
      - flight-network

volumes:
  flight-data:

networks:
  flight-network:
    driver: bridge
