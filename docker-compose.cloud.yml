# Cloud override: points backends at the cloud Ollama service and the Azure service names.
# Use together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.cloud.yml config
services:
  ollama:
    build:
      context: ./ollama
    ports:
      - "11434:11434"

  student-AlvindhoEdlyn:
    environment:
      AI_MODE_ENABLED: "true"
      OLLAMA_BASE_URL: http://ollama:11434/v1
      SHARED_API_URL: http://shared-backend:5000
      RAG_ENABLED: "true"
      RAG_SERVICE_URL: http://rag-server:5100
      MULTI_AGENT_ENABLED: "true"
      MULTI_AGENT_URL: http://multi-agent-server:5300
      MCP_ENABLED: "true" 

  student-KeyuanGan-backend:
    environment:
      AI_MODE_ENABLED: "true"
      OLLAMA_BASE_URL: http://ollama:11434
      MCP_ENABLED: "true"
      RAG_ENABLED: "true"
      MULTI_AGENT_ENABLED: "true"

  student-RenzoRobin-backend:
    environment:
      AI_MODE_ENABLED: "true"
      OLLAMA_BASE_URL: http://ollama:11434
      RAG_ENABLED: "true"
      RAG_SERVICE_URL: http://rag-server:5100
      MULTI_AGENT_ENABLED: "true"
      MULTI_AGENT_SERVICE_URL: http://multi-agent-server:5300
      MCP_ENABLED: "true"
      MCP_SERVICE_URL: http://mcp-server:5200/mcp
  student-TrongDao-backend:
    environment:
      AI_MODE_ENABLED: "true"
      OLLAMA_API_URL: http://ollama:11434
      MCP_ENABLED: "true"
      MCP_SERVER_URL: http://mcp-server:5200/mcp
      RAG_ENABLED: "true"
      RAG_SERVER_URL: http://rag-server:5100
      MULTI_AGENT_ENABLED: "true"
      MULTI_AGENT_SERVICE_URL: http://multi-agent-server:5300

  yajunning-backend-service:
    environment:
      AI_MODE_ENABLED: "true"
      OLLAMA_BASE_URL: http://ollama:11434/v1
      MCP_ENABLED: "true"
      MCP_SERVER_URL: http://mcp-server:5200/mcp
      RAG_ENABLED: "true"
      RAG_SERVICE_URL: http://rag-server:5100
      MULTI_AGENT_ENABLED: "true"