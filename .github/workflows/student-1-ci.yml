name: Student 1 - Itinerary Planner CI

on:
  push:
    paths:
      - "student-AlvindhoEdlyn/**"
      - ".github/workflows/student-1-ci.yml"
  pull_request:
    paths:
      - "student-AlvindhoEdlyn/**"
      - ".github/workflows/student-1-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Itinerary Planner
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: student-AlvindhoEdlyn/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r student-AlvindhoEdlyn/requirements.txt
          python -m pip install pytest

      - name: Check Python syntax
        run: |
          python -m py_compile student-AlvindhoEdlyn/backend/app.py
          python -m py_compile student-AlvindhoEdlyn/database/init_db.py

      - name: Run tests
        run: |
          pytest student-AlvindhoEdlyn/tests -v

  docker-build:
    name: Build Itinerary Planner Containers
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build frontend image
        run: |
          docker build \
            -t journeybuddy-alvindhoedlyn-frontend \
            ./student-AlvindhoEdlyn/frontend

      - name: Build database image
        run: |
          docker build \
            -t journeybuddy-alvindhoedlyn-database \
            ./student-AlvindhoEdlyn/database