name: Student 1 - Itinerary Planner 

on:
  push:
    branches: [ main ]
    paths:
      - 'student-AlvindhoEdlyn/**'
      - '.github/workflows/student-1-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'student-AlvindhoEdlyn/**'
      - '.github/workflows/student-1-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r student-AlvindhoEdlyn/requirements.txt pytest
      - name: Grant execution permissions
        run: chmod +x student-AlvindhoEdlyn/backend/app.py
      - name: Run tests
        run: python -m pytest student-AlvindhoEdlyn/tests -q
