name: Student 3 - Accommodation Recommender CI

on:
  push:
    paths:
      - "student-RenzoRobin/**"
      - ".github/workflows/student-3-ci.yml"

  pull_request:
    paths:
      - "student-RenzoRobin/**"
      - ".github/workflows/student-3-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Accommodation Recommender
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            student-RenzoRobin/backend/requirements.txt
            student-RenzoRobin/database/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r student-RenzoRobin/backend/requirements.txt
          python -m pip install \
            -r student-RenzoRobin/database/requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile \
            student-RenzoRobin/backend/app.py
          python -m py_compile \
            student-RenzoRobin/database/app.py

      - name: Run backend and database tests
        env:
          MCP_ENABLED: "false"
          RAG_ENABLED: "false"
          MULTI_AGENT_ENABLED: "false"
        run: |
          pip install pytest
          pytest student-RenzoRobin/tests/test_backend.py student-RenzoRobin/tests/test_database.py -v

      - name: Post-commit endpoint tests (POST /recommendations and POST /multi-agent/run)
        env:
          MCP_ENABLED: "false"
          RAG_ENABLED: "false"
          MULTI_AGENT_ENABLED: "false"
        run: |
          mkdir -p reports
          pytest student-RenzoRobin/tests/post_commit -v --junitxml=reports/student-3-post-commit.xml

      - name: Upload post-commit test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-3-post-commit-evidence
          path: reports/

  docker-build:
    name: Build Accommodation Recommender Containers
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build frontend image
        run: |
          docker build \
            -t journeybuddy-renzorobin-frontend \
            ./student-RenzoRobin/frontend

      - name: Build backend image
        run: |
          docker build \
            -t journeybuddy-renzorobin-backend \
            ./student-RenzoRobin/backend

      - name: Build database image
        run: |
          docker build \
            -t journeybuddy-renzorobin-database \
            ./student-RenzoRobin/database