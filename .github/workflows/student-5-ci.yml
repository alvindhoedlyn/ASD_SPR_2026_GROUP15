name: Student YajunNing CI

on:
  push:
    paths:
      - 'student-YajunNing/**'
      - 'ai-services/mcp-server/**'
      - 'ai-services/rag-server/**'
      - 'ai-services/multi-agent-server/**'
      - '.github/workflows/student-5-ci.yml'
      - 'docker-compose.yml'
  pull_request:
    branches: [main]
    paths:
      - 'student-YajunNing/**'
      - 'ai-services/mcp-server/**'
      - 'ai-services/rag-server/**'
      - 'ai-services/multi-agent-server/**'
      - '.github/workflows/student-5-ci.yml'
      - 'docker-compose.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      MCP_ENABLED: "false"
      RAG_ENABLED: "false"
      MULTI_AGENT_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flight Recommender dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r student-YajunNing/backend/requirements.txt
          pip install -r student-YajunNing/database/requirements.txt
          pip install -r ai-services/rag-server/requirements.txt
          pip install pytest

      - name: Check Student 5 Python syntax
        run: |
          python -m py_compile student-YajunNing/backend/*.py
          python -m py_compile student-YajunNing/database/*.py

      - name: Run Flight Recommender tests
        working-directory: student-YajunNing
        run: python -m unittest discover -s tests -v

      - name: Run Release 2 post-commit endpoint tests
        run: |
          mkdir -p reports/student-5
          python -m pytest \
            student-YajunNing/tests/post_commit/test_multi_agent_endpoints.py \
            -v \
            --junitxml=reports/student-5/post-commit-results.xml

      - name: Upload Student 5 endpoint test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-5-post-commit-evidence
          path: reports/student-5/

      - name: Validate Flight MCP and RAG integration syntax
        run: |
          python -m py_compile ai-services/mcp-server/server.py
          python -m py_compile ai-services/mcp-server/tools_flights.py
          python -m py_compile ai-services/rag-server/rag_http_server.py
          python -m py_compile ai-services/rag-server/rag_pipeline.py
          python -m py_compile ai-services/rag-server/corpus_flights.py

      - name: Validate Student 5 Docker Compose
        run: docker compose -f student-YajunNing/docker-compose.yml config --quiet

      - name: Build Flight frontend image
        run: docker build -t journeybuddy-yajun-frontend ./student-YajunNing/frontend

      - name: Build Flight backend image
        run: docker build -t journeybuddy-yajun-backend ./student-YajunNing/backend

      - name: Build Flight database image
        run: docker build -t journeybuddy-yajun-database ./student-YajunNing/database
