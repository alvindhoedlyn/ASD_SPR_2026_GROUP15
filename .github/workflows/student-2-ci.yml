name: Student 2 - Budget Tracker CI

on:
  push:
    paths:
      - "student-KeyuanGan/**"
      - ".github/workflows/student-2-ci.yml"

  pull_request:
    paths:
      - "student-KeyuanGan/**"
      - ".github/workflows/student-2-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:

  test:
    name: Test Budget Tracker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            student-KeyuanGan/backend/requirements.txt
            student-KeyuanGan/database/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r student-KeyuanGan/backend/requirements.txt
          python -m pip install \
            -r student-KeyuanGan/database/requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile \
            student-KeyuanGan/backend/app.py

          python -m py_compile \
            student-KeyuanGan/backend/database_client.py

          python -m py_compile \
            student-KeyuanGan/backend/llm_client.py

          python -m py_compile \
            student-KeyuanGan/backend/agentic_loop.py

          python -m py_compile \
            student-KeyuanGan/database/app.py

      - name: Run automated tests
        run: |
          python -m unittest \
            student-KeyuanGan/tests/test_placeholder.py \
            -v


  docker-build:
    name: Build Budget Tracker Containers
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    steps:

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Budget Tracker app image
        run: |
          docker build \
            -t journeybuddy-student-keyuangan \
            ./student-KeyuanGan

      - name: Build database microservice image
        run: |
          docker build \
            -t journeybuddy-student-keyuangan-database \
            ./student-KeyuanGan/database