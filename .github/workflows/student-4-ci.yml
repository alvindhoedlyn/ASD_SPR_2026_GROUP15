name: Student 4 - Location Recommender CI

on:
  push:
    paths:
      - "student-TrongDao/**"
      - ".github/workflows/student-4-ci.yml"
      - "ai-services/mcp-server/**"
      - "ai-services/rag-server/**"
      - "docker-compose.yml"

  pull_request:
    paths:
      - "student-TrongDao/**"
      - ".github/workflows/student-4-ci.yml"
      - "ai-services/mcp-server/**"
      - "ai-services/rag-server/**"
      - "docker-compose.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Location Recommender
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      MCP_ENABLED: "false"
      RAG_ENABLED: "false"
      MCP_SERVER_URL: ""
      RAG_SERVER_URL: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            student-TrongDao/backend/requirements.txt
            student-TrongDao/database/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r student-TrongDao/backend/requirements.txt
          python -m pip install \
            -r student-TrongDao/database/requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile \
            student-TrongDao/backend/app.py
          python -m py_compile \
            student-TrongDao/database/app.py
          python -m py_compile \
            student-TrongDao/database/init_db.py
          python -m py_compile \
            student-TrongDao/agentic_loop/main.py \
            student-TrongDao/agentic_loop/config/review_config.py \
            student-TrongDao/agentic_loop/collectors/mcp_collector.py \
            student-TrongDao/agentic_loop/collectors/rag_collector.py \
            student-TrongDao/agentic_loop/pipelines/mcp_validation_pipeline.py \
            student-TrongDao/agentic_loop/pipelines/rag_validation_pipeline.py

      - name: Initialise test database
        env:
          DATABASE_PATH: /tmp/location-recommender-ci.db
        run: |
          python student-TrongDao/database/init_db.py --reset

      - name: Run backend and database tests
        run: |
          python -m pytest \
            student-TrongDao/tests/test_backend.py \
            student-TrongDao/tests/test_database.py \
            student-TrongDao/tests/test_agentic_loop.py \
            -v

  docker-build:
    name: Build Location Recommender Containers
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build frontend target
        run: |
          docker build \
            --target frontend \
            -t journeybuddy-location-frontend \
            ./student-TrongDao

      - name: Build backend target
        run: |
          docker build \
            --target backend \
            -t journeybuddy-location-backend \
            ./student-TrongDao

      - name: Build database target
        run: |
          docker build \
            --target database \
            -t journeybuddy-location-database \
            ./student-TrongDao
