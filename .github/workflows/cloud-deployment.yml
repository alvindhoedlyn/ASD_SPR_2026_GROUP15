name: Cloud Deployment (Azure Container Apps)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: journeybuddy-rg
  LOCATION: australiaeast

jobs:
  post_commit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pytest -r student-RenzoRobin/backend/requirements.txt -r student-RenzoRobin/database/requirements.txt

      - name: Endpoint tests (AI features off)
        env:
          MCP_ENABLED: "false"
          RAG_ENABLED: "false"
          MULTI_AGENT_ENABLED: "false"
        run: pytest student-RenzoRobin/tests/post_commit -v

      - name: Check cloud compose keeps AI features off
        run: |
          docker compose -f docker-compose.yml -f docker-compose.cloud.yml config >