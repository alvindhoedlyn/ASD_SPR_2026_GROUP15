services:
  shared-frontend:
    build:
      context: ./shared/frontend
    image: journeybuddy-shared-frontend
    container_name: shared-frontend
    ports:
      - "3000:80"
    networks:
      - journeybuddy-net
    depends_on:
      - shared-backend
      - student-AlvindhoEdlyn
      - student-KeyuanGan
      - student-RenzoRobin-backend
      - student-TrongDao
      - student-YajunNing

  shared-backend:
    build:
      context: ./shared/backend
    image: journeybuddy-shared-backend
    container_name: shared-backend
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      DATABASE_API_URL: http://shared-database:6000
    networks:
      - journeybuddy-net
    depends_on:
      - shared-database

  shared-database:
    build:
      context: ./shared/database
    image: journeybuddy-shared-database
    container_name: shared-database
    ports:
      - "6000:6000"
    environment:
      PORT: "6000"
      DATABASE_PATH: /app/data/app.db
    volumes:
      - shared-data:/app/data
    networks:
      - journeybuddy-net

  student-AlvindhoEdlyn:
    build: ./student-AlvindhoEdlyn
    image: journeybuddy-student-alvindhoedlyn
    container_name: student-AlvindhoEdlyn-app
    ports:
      - "5001:5000"
    volumes:
      - alvindhoedlyn-data:/app/instance
    environment:
      - OLLAMA_BASE_URL=http://ai-mode:11434
    networks:
      - journeybuddy-net
    depends_on:
      - ai-mode

  student-KeyuanGan:
    build: ./student-KeyuanGan
    image: journeybuddy-student-keyuangan
    container_name: student-KeyuanGan-app
    ports:
      - "5002:5000"
    volumes:
      - keyuangan-data:/app/instance
    environment:
      - OLLAMA_BASE_URL=http://ai-mode:11434
    networks:
      - journeybuddy-net
    depends_on:
      - ai-mode

  student-RenzoRobin-frontend:
    build:
      context: ./student-RenzoRobin/frontend
    image: journeybuddy-renzorobin-frontend
    container_name: student-RenzoRobin-frontend
    ports:
      - "3003:80"
    networks:
      - journeybuddy-net
    depends_on:
      - student-RenzoRobin-backend
    restart: unless-stopped

  student-RenzoRobin-backend:
    build:
      context: ./student-RenzoRobin/backend
    image: journeybuddy-renzorobin-backend
    container_name: student-RenzoRobin-backend
    ports:
      - "5003:5003"
    environment:
      PORT: "5003"
      DATABASE_API_URL: http://student-RenzoRobin-database:6003
      OLLAMA_BASE_URL: http://ai-mode:11434
      OLLAMA_MODEL: qwen2.5:0.5b
    networks:
      - journeybuddy-net
    depends_on:
      - student-RenzoRobin-database
      - ai-mode
    restart: unless-stopped

  student-RenzoRobin-database:
    build:
      context: ./student-RenzoRobin/database
    image: journeybuddy-renzorobin-database
    container_name: student-RenzoRobin-database
    ports:
      - "6003:6003"
    environment:
      PORT: "6003"
      DATABASE_PATH: /app/data/accommodation.db
    volumes:
      - renzorobin-data:/app/data
    networks:
      - journeybuddy-net
    restart: unless-stopped
  student-TrongDao:
    build:
      context: ./student-TrongDao
      target: frontend
    image: journeybuddy-trongdao-frontend
    container_name: student-TrongDao-frontend
    ports:
      - "5004:80"
    networks:
      - journeybuddy-net
    depends_on:
      - student-TrongDao-backend

  student-TrongDao-backend:
    build:
      context: ./student-TrongDao
      target: backend
    image: journeybuddy-trongdao-backend
    container_name: student-TrongDao-backend
    ports:
      - "5104:5000"
    environment:
      PORT: "5000"
      DATABASE_API_URL: http://student-TrongDao-database:5000
      OLLAMA_API_URL: http://ai-mode:11434
      OLLAMA_MODEL: qwen2.5:0.5b
      OLLAMA_REVIEW_MODEL: llama3.1:8b
    networks:
      - journeybuddy-net
    depends_on:
      - student-TrongDao-database
      - ai-mode

  student-TrongDao-database:
    build:
      context: ./student-TrongDao
      target: database
    image: journeybuddy-trongdao-database
    container_name: student-TrongDao-database
    ports:
      - "5404:5000"
    environment:
      PORT: "5000"
      DATABASE_PATH: /app/database/data/location_recommender.db
    volumes:
      - trongdao-data:/app/database/data
    networks:
      - journeybuddy-net

  student-YajunNing:
    build: ./student-YajunNing/frontend
    image: journeybuddy-student-yajunning-frontend
    container_name: student-YajunNing-frontend
    ports:
      - "5005:80"
    networks:
      - yajunning-net
    depends_on:
      - yajunning-backend-service

  yajunning-backend-service:
    build: ./student-YajunNing/backend
    image: journeybuddy-student-yajunning-backend
    container_name: student-YajunNing-backend
    environment:
      DATABASE_SERVICE_URL: http://yajunning-database-service:5001
      AUTH_SERVICE_URL: http://shared-backend:5000
      OLLAMA_BASE_URL: http://ai-mode:11434/v1
      OLLAMA_MODEL: qwen2.5:0.5b
    networks:
      - journeybuddy-net
      - yajunning-net
    depends_on:
      - ai-mode
      - yajunning-database-service

  yajunning-database-service:
    build: ./student-YajunNing/database
    image: journeybuddy-student-yajunning-database
    container_name: student-YajunNing-database
    volumes:
      - yajunning-data:/app/data
    networks:
      - yajunning-net

  ai-mode:
    image: ollama/ollama:latest
    container_name: ai-mode
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - journeybuddy-net

networks:
  journeybuddy-net:
    driver: bridge
  yajunning-net:
    driver: bridge

volumes:
  ollama-models:
  shared-data:
  alvindhoedlyn-data:
  keyuangan-data:
  renzorobin-data:
  trongdao-data:
  yajunning-data:
