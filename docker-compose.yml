services:
  shared-frontend:
    build: ./shared
    image: journeybuddy-shared
    container_name: shared-frontend
    volumes:
      - shared-data:/app/instance
    ports:
      - "8080:80"
    networks:
      - journeybuddy-net
    depends_on:
      - student-AlvindhoEdlyn
      - student-KeyuanGan
      - student-RenzoRobin
      - student-TrongDao
      - student-YajunNing
  student-AlvindhoEdlyn:
    build: ./student-AlvindhoEdlyn
    image: journeybuddy-student-alvindhoedlyn
    container_name: student-AlvindhoEdlyn-app
    ports:
      - "5001:5000"
    volumes:
      - alvindhoedlyn-data:/app/instance
    environment:
      - OLLAMA_BASE_URL=http://ai-mode:11434
    networks:
      - journeybuddy-net
    depends_on:
      - ai-mode

  student-KeyuanGan:
    build: ./student-KeyuanGan
    image: journeybuddy-student-keyuangan
    container_name: student-KeyuanGan-app
    ports:
      - "5002:5000"
    volumes:
      - keyuangan-data:/app/instance
    environment:
      - OLLAMA_BASE_URL=http://ai-mode:11434
    networks:
      - journeybuddy-net
    depends_on:
      - ai-mode

  student-RenzoRobin:
    build: ./student-RenzoRobin
    image: journeybuddy-student-renzorobin
    container_name: student-RenzoRobin-app
    ports:
      - "5003:5000"
    volumes:
      - renzorobin-data:/app/instance
    environment:
      - OLLAMA_BASE_URL=http://ai-mode:11434
    networks:
      - journeybuddy-net
    depends_on:
      - ai-mode

  student-TrongDao:
    build:
      context: ./student-TrongDao
      target: frontend
    image: journeybuddy-trongdao-frontend
    container_name: student-TrongDao-frontend
    ports:
      - "5004:80"
    networks:
      - journeybuddy-net
    depends_on:
      - student-TrongDao-backend

  student-TrongDao-backend:
    build:
      context: ./student-TrongDao
      target: backend
    image: journeybuddy-trongdao-backend
    container_name: student-TrongDao-backend
    ports:
      - "5104:5000"
    environment:
      PORT: "5000"
      DATABASE_API_URL: http://student-TrongDao-database:5000
      OLLAMA_API_URL: http://ai-mode:11434
      OLLAMA_MODEL: qwen2.5:0.5b
      OLLAMA_REVIEW_MODEL: llama3.1:8b
    networks:
      - journeybuddy-net
    depends_on:
      - student-TrongDao-database
      - ai-mode

  student-TrongDao-database:
    build:
      context: ./student-TrongDao
      target: database
    image: journeybuddy-trongdao-database
    container_name: student-TrongDao-database
    ports:
      - "5404:5000"
    environment:
      PORT: "5000"
      DATABASE_PATH: /app/database/data/location_recommender.db
    volumes:
      - trongdao-data:/app/database/data
    networks:
      - journeybuddy-net

  student-YajunNing:
    build: ./student-YajunNing
    image: journeybuddy-student-yajunning
    container_name: student-YajunNing-app
    ports:
      - "5005:5000"
    volumes:
      - yajunning-data:/app/instance
    environment:
      - OLLAMA_BASE_URL=http://ai-mode:11434
    networks:
      - journeybuddy-net
    depends_on:
      - ai-mode
  ai-mode:
    image: ollama/ollama:latest
    container_name: ai-mode
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - journeybuddy-net

networks:
  journeybuddy-net:
    driver: bridge

volumes:
  ollama-models:
  shared-data:
  alvindhoedlyn-data:
  keyuangan-data:
  renzorobin-data:
  trongdao-data:
  yajunning-data:
