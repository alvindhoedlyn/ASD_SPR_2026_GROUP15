server {
    listen 80;
    include /etc/nginx/mime.types;
    
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Preserves /api/ in the requested path sent to the backend container
    location /api/ {
        proxy_pass http://student-AlvindhoEdlyn:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ask-with-context {
        proxy_pass http://student-AlvindhoEdlyn:5001/ask-with-context;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}