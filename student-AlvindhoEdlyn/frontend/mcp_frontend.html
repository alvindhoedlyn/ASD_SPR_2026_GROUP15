<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JourneyBuddy — MCP MODE</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="app-header">
    <div class="brand">
        <a href="http://localhost:3000">JourneyBuddy</a>
    </div>

    <!-- Navigation Links -->
    <nav class="nav-menu">
        <a href="/" class="nav-link-btn">Itinerary</a>
        <a href="/mcp_frontend.html" class="nav-link-btn">MCP Panel</a>
        <a href="/rag_frontend.html" class="nav-link-btn">RAG Assistant</a>
    </nav>

    <div class="user-area">
        <span>Welcome!</span>
    </div>
</header>

<main>
  <h1 class="title">Itinerary Planner</h1>
  <div class="mcp-bar">
    <span id="mcpStatus" class="mcp-status off">MCP mode off</span>
    <label class="mcp-switch">
      <input type="checkbox" id="mcpToggle" role="switch">
      MCP mode
    </label>
    <button type="button" id="mcpRefresh" class="btn mcp-run" hidden>Reload tools</button>
  </div>

  <p id="mcpOffNote" class="mcp-off-note">Turn on MCP mode to load the tools from the MCP server and run them one at a time.</p>

  <section id="mcpPanel" hidden>
    <div class="plan-frame"><div id="toolList"></div></div>

    <h2 class="mcp-log-title">Call log</h2>
    <ul id="callLog" class="mcp-log"><li>No calls yet.</li></ul>
  </section>
</main>

<script src="js/script.js"></script>
<script src="js/mcp_script.js"></script>
</body>
</html>
