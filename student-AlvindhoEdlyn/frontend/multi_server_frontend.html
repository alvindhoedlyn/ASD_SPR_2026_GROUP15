<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JourneyBuddy — Multi-Server</title>
  <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="app-header">
    <div class="brand">
        <a href="http://localhost:3000">JourneyBuddy</a>
    </div>

    <!-- Navigation Links -->
    <nav class="nav-menu">
        <a href="/" class="nav-link-btn">Itinerary</a>
        <a href="/mcp_frontend.html" class="nav-link-btn">MCP Panel</a>
        <a href="/rag_frontend.html" class="nav-link-btn">RAG Assistant</a>
        <a href="/multi_server_frontend.html" class="nav-link-btn" aria-current="page">Multi-Server</a>

    </nav>

    <div class="user-area">
        <span>Welcome!</span>
    </div>
</header>

<main>
    <div class="ma-wrap">
        <h1>Multi Agent Server</h1>

        <!-- Server on/off toggle: when off, no requests are sent to the backend -->
        <div class="mcp-bar">
            <span id="serverStatus" class="mcp-status off">Server off</span>
            <label class="mcp-switch">
                <input type="checkbox" id="serverToggle" role="switch" aria-checked="false">
                Server
            </label>
        </div>

        <!-- Prompt input -->
        <form class="prompt-form" id="promptForm" autocomplete="off">
            <label for="promptInput" class="sr-only" style="position:absolute;left:-9999px;">Prompt</label>
            <input type="text" id="promptInput" placeholder="Enter a prompt for the multi-agent workflow…" required>
            <button type="submit" class="send-btn" id="sendBtn" aria-label="Send prompt">&rarr;</button>
        </form>

        <!-- Premade prompts: clicking fills the textbox -->
        <div class="test-prompts">
            <button type="button" class="btn btn-alt test-prompt" data-prompt="What activities can I do in Melbourne if it rains?">Test Prompt 1</button>
            <button type="button" class="btn btn-alt test-prompt" data-prompt="Suggest a weekend itinerary in Sydney that focuses on food and coastal walks.">Test Prompt 2</button>
            <button type="button" class="btn btn-alt test-prompt" data-prompt="Provide a 3 day itinerary list for Darwin.">Test Prompt 3</button>
        </div>

        <!-- Final output log -->
        <section class="plan-frame final-frame" aria-labelledby="finalTitle">
            <h2 class="frame-title" id="finalTitle">Output Log</h2>
            <span class="log-status" id="finalStatus">Idle</span>
            <div class="log-box empty" id="finalLog" aria-live="polite">Send a prompt to see the final output here.</div>
        </section>

        <!-- Per-agent logs (scroll down) -->
        <section class="agent-logs" aria-label="Agent logs">
            <article class="agent-panel">
                <header>
                    <h2>Planner Log</h2>
                    <span class="agent-dot" id="dot-planner"></span>
                </header>
                <div class="log-box empty" id="log-planner">No activity yet.</div>
            </article>

            <article class="agent-panel">
                <header>
                    <h2>Worker Log</h2>
                    <span class="agent-dot" id="dot-worker"></span>
                </header>
                <div class="log-box empty" id="log-worker">No activity yet.</div>
            </article>

            <article class="agent-panel">
                <header>
                    <h2>Reviewer Log</h2>
                    <span class="agent-dot" id="dot-reviewer"></span>
                </header>
                <div class="log-box empty" id="log-reviewer">No activity yet.</div>
            </article>
        </section>

        <!-- Human approval -->
        <section class="approval-panel" aria-labelledby="approvalTitle">
            <header class="approval-header">
                <h2 id="approvalTitle">Human Approval</h2>
                <span class="approval-status" id="approvalStatus" role="status" aria-live="polite">Awaiting output</span>
            </header>

            <div class="approval-body">
                <label for="approvalFeedback" class="approval-label">
                    Feedback <span class="optional">(required for Partially Approve and Reject)</span>
                </label>
                <textarea id="approvalFeedback" rows="4" placeholder="Explain what is good, what needs changing, or why it was rejected…" disabled></textarea>

                <div class="approval-actions">
                    <button type="button" class="btn approval-btn" id="approveBtn" data-decision="approve" disabled>APPROVE</button>
                    <button type="button" class="btn btn-warn approval-btn" id="partialBtn" data-decision="partial" disabled>PARTIALLY APPROVE</button>
                    <button type="button" class="btn btn-danger approval-btn" id="rejectBtn" data-decision="reject" disabled>REJECT</button>
                </div>
            </div>
        </section>
    </div>
</main>

</body>
 <script src="http://localhost:3000/js/main.js"></script>
 <script src="js/script.js"></script>
 <script src="js/mas_script.js"></script>

</html>
